# Blocking AI code review against the rules in AGENTS.md (openspec change: add-agent-code-review).
#
#   gate -> reviewers (architecture | tests | spec) -> verify -> publish
#
# - Engines (Claude Sonnet, Gemini fallback) get read-only repository access and no GitHub write token.
# - Only `publish` (deterministic, no LLM) can write PR comments and set the final status.
# - Review tooling (scripts/review, .github/review, AGENTS.md) always comes from the same commit as this
#   workflow definition (github.sha); the PR head is checked out separately into ./pr and only read.
# - Merge gate: the `agent-review` commit status on the PR head (required by the main ruleset).
#   gate sets it to pending; publish sets success only if every reviewer ran and no finding survived.
#   A cancelled or failed run leaves it pending (fail-closed). New pushes have no status until re-reviewed.
# - Reviews are always plain comments: never APPROVE, never REQUEST_CHANGES.
name: Agent Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, labeled]
  issue_comment:
    types: [created]

permissions: {}

# Only real review triggers share the per-PR group (and cancel each other); every other event gets a
# unique group so that, e.g., an unrelated PR comment never cancels a running review.
concurrency:
  group: >-
    ${{
      ((github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'needs-review')) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
      && format('agent-review-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('agent-review-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.312

jobs:
  gate:
    name: Gate
    if: >-
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'needs-review')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr: ${{ steps.decide.outputs.pr }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
    steps:
      - name: Decide whether to review
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          draft=$(jq -r '.draft' <<<"$pr_json")
          state=$(jq -r '.state' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          run=true
          if [ "$state" != open ]; then echo "::notice::PR is not open; skipping"; run=false; fi
          if [ "$draft" = true ]; then echo "::notice::Draft PR; skipping until ready for review"; run=false; fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then echo "::notice::Fork PR ($head_repo); skipping"; run=false; fi
          if [ "$base_ref" != main ]; then echo "::notice::PR does not target main; skipping"; run=false; fi
          {
            echo "run=$run"
            echo "pr=$PR_NUMBER"
            echo "head_sha=$(jq -r '.head.sha' <<<"$pr_json")"
            echo "base_ref=$base_ref"
          } >>"$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$(jq -r '.head.sha' <<<"$pr_json")" \
              -f state=pending -f context=agent-review -f description="Agent review in progress" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi

  reviewers:
    name: Review (${{ matrix.reviewer }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        reviewer: [architecture, tests, spec]
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@v5
        with:
          path: tools
          persist-credentials: false

      - name: Run reviewer
        uses: ./tools/.github/actions/review-engine
        with:
          stage: ${{ matrix.reviewer }}
          head-sha: ${{ needs.gate.outputs.head_sha }}
          base-ref: ${{ needs.gate.outputs.base_ref }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}

  verify:
    name: Review (verify)
    needs: [gate, reviewers]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@v5
        with:
          path: tools
          persist-credentials: false

      - name: Run verifier
        uses: ./tools/.github/actions/review-engine
        with:
          stage: verify
          head-sha: ${{ needs.gate.outputs.head_sha }}
          base-ref: ${{ needs.gate.outputs.base_ref }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}

  publish:
    name: Publish review
    needs: [gate, verify]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@v5
        with:
          path: tools
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download findings
        uses: actions/download-artifact@v5
        with:
          pattern: review-*
          path: review-out
          merge-multiple: true

      - name: Publish review and sticky summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          REVIEW_DIR: review-out
        run: node tools/scripts/review/publish.ts publish
