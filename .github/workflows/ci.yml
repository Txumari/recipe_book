name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js v24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      # 🧱 Static quality gates (AGENTS.md) — run first; later checks still run if they fail
      - name: Type Check
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Architecture Boundaries
        id: architecture
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:architecture

      - name: Install Playwright browsers with system dependencies
        id: playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Run Unit & HTTP Integration Tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Run Playwright E2E Browser Tests
        id: e2e
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: npm run test:e2e

      - name: Build Vite Production Bundle
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # 📸 Upload Playwright Screenshots & Traces on Failure
      - name: Upload Playwright Failure Artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: test-results/
          retention-days: 7

      # 💬 Post / Update Sticky PR Comment
      - name: Post PR Test Report Comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### 🧪 CI Pipeline Results: ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}
            
            | Check | Status | Command |
            | :--- | :--- | :--- |
            | **Type Check** | ${{ steps.typecheck.outcome == 'success' && '✅ Passed' || (steps.typecheck.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | `npm run typecheck` |
            | **Architecture Boundaries (R1)** | ${{ steps.architecture.outcome == 'success' && '✅ Passed' || (steps.architecture.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | `npm run check:architecture` |
            | **Unit & Integration Tests** | ${{ steps.test.outcome == 'success' && '✅ Passed' || (steps.test.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | `npm run test` |
            | **Playwright E2E Tests** | ${{ steps.e2e.outcome == 'success' && '✅ Passed' || (steps.e2e.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | `npm run test:e2e` |
            | **Vite Production Build** | ${{ steps.build.outcome == 'success' && '✅ Passed' || (steps.build.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | `npm run build` |
            
            ${{ steps.e2e.outcome == 'failure' && '_📸 Failure screenshots & trace logs have been uploaded to Workflow Artifacts._' || (job.status == 'success' && '_All checks passed successfully! Ready for merge._' || '_Some checks failed — see the workflow logs for details._') }}
